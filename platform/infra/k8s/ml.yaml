# Intelligence plane on a DEDICATED GPU node pool, autoscaled independently of
# the CPU app/render tiers — this separation is what keeps GPU cost governable.
# CPU mocks run fine without GPUs; drop the nodeSelector/tolerations/limits for
# a CPU-only deployment. (Manifests are reference-grade: not yet cluster-tested.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml
  namespace: onepct
spec:
  replicas: 1
  selector: { matchLabels: { app: ml } }
  template:
    metadata: { labels: { app: ml } }
    spec:
      nodeSelector:
        node-pool: gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: ml
          image: onepct/ml:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: platform-config } }]
          env:
            - { name: ASR_BACKEND, value: auto }
          resources:
            requests: { cpu: "2", memory: 4Gi }
            limits: { nvidia.com/gpu: 1 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
---
apiVersion: v1
kind: Service
metadata:
  name: ml
  namespace: onepct
spec:
  selector: { app: ml }
  ports: [{ port: 8000, targetPort: 8000 }]
---
# Scale on demand; min 0 keeps the GPU pool empty when idle (spot-friendly).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ml
  namespace: onepct
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ml }
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
