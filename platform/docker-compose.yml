name: onepct-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onepct
      POSTGRES_PASSWORD: onepct
      POSTGRES_DB: onepct
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onepct"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.25
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: onepct
      POSTGRES_PWD: onepct
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8233:8080"

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: onepct
      MINIO_ROOT_PASSWORD: onepct-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 onepct onepct-secret &&
      mc mb -p local/sources local/artifacts local/renders &&
      mc anonymous set download local/renders &&
      echo buckets-ready"

  ml:
    build: ./services/ml
    environment:
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: onepct
      S3_SECRET_KEY: onepct-secret
      ASR_BACKEND: ${ASR_BACKEND:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"

  render:
    build: ./services/render
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: onepct
      S3_SECRET_KEY: onepct-secret
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    environment:
      DATABASE_URL: postgresql://onepct:onepct@postgres:5432/onepct
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_TASK_QUEUE: video-pipeline
      ML_URL: http://ml:8000
      RENDER_URL: http://render:8080
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: onepct
      S3_SECRET_KEY: onepct-secret
    depends_on:
      temporal:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://onepct:onepct@postgres:5432/onepct
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_TASK_QUEUE: video-pipeline
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: onepct
      S3_SECRET_KEY: onepct-secret
      API_PORT: "3001"
      JWT_SECRET: dev-jwt-secret-change-me
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    ports:
      - "3001:3001"
    restart: on-failure

volumes:
  pgdata:
  miniodata:
