name: Uptime Check

# Pings the live site + AI endpoint on a schedule. Runs on GitHub's network
# (not the sandboxed dev environment), so it can actually reach the site.
# A failed run notifies repo members per their GitHub Actions notification
# settings (email by default).

on:
  # Post-deploy check on a trigger that is proven to fire here. GitHub's
  # scheduler has never run this workflow; workflow_run drives the smoke test
  # after every deploy without fail, so a deploy at least always gets verified.
  workflow_run:
    workflows: ["Deploy to Firebase"]
    types: [completed]
  schedule:
    # Every 5 minutes (GitHub's minimum; scheduled runs may be delayed under
    # load). This repo is public, so Actions minutes are free — there is no
    # cost reason to check less often, and 5-minute precision on "when did it
    # break" is worth having. Currently NOT firing; see the note above.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check homepage is up
        run: |
          URL="https://onepstudio-9a3ef.web.app"
          echo "Checking $URL"
          # Retry a few times so a single transient blip doesn't page anyone.
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || echo 000)
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Homepage OK"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Homepage $URL is DOWN (last HTTP $code)"
          exit 1

      - name: Check AI endpoint (Cloud Function) is alive
        run: |
          # A GET hits the analyzeVideo function, which returns 405 for non-POST.
          # 405 means the function is deployed and responding. 404/5xx means it's
          # missing or erroring, which is what breaks content generation.
          URL="https://onepstudio-9a3ef.web.app/api/analyze"
          echo "Checking $URL"
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || echo 000)
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "405" ] || [ "$code" = "200" ]; then
              echo "AI endpoint alive (HTTP $code)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::AI endpoint $URL is not responding correctly (last HTTP $code) — content generation is likely broken"
          exit 1

      - name: Check error-reporting endpoint is alive
        run: |
          # The pipe that reports failures is itself a failure point: if this is
          # down, client errors vanish silently and everything downstream goes
          # quiet while looking healthy. Probe it from the outside. Same
          # 405-means-deployed contract as /api/analyze.
          URL="https://onepstudio-9a3ef.web.app/api/client-error"
          echo "Checking $URL"
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || echo 000)
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "405" ] || [ "$code" = "204" ]; then
              echo "Error-reporting endpoint alive (HTTP $code)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Error reporting $URL is not responding (last HTTP $code) — client errors are being lost"
          exit 1
