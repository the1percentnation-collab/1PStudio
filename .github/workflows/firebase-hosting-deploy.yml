name: Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Install functions dependencies and build
        run: |
          cd functions
          npm ci
          npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Functions to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          # firebase-functions v2 auto-loads functions/.env at runtime.
          # (firebase deploy has no --set-env-vars flag — that's a gcloud flag.)
          # Social publishing (Zernio) and Higgsfield use Secret Manager secrets
          # (ZERNIO_API_KEY, HIGGSFIELD_CREDENTIALS) bound in the function code,
          # so they are NOT written here — `firebase deploy` binds them from
          # Secret Manager automatically. Set them once with:
          #   firebase functions:secrets:set ZERNIO_API_KEY
          #   firebase functions:secrets:set HIGGSFIELD_CREDENTIALS
          # Strip stray CR/LF/whitespace from secret values so a valid,
          # single-line dotenv file is written, and skip empty keys.
          ANTHROPIC_CLEAN="$(printf '%s' "$ANTHROPIC_API_KEY" | tr -d '\r\n' | xargs)"
          DEEPGRAM_CLEAN="$(printf '%s' "$DEEPGRAM_API_KEY" | tr -d '\r\n' | xargs)"
          {
            printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_CLEAN"
            if [ -n "$DEEPGRAM_CLEAN" ]; then
              printf 'DEEPGRAM_API_KEY=%s\n' "$DEEPGRAM_CLEAN"
            fi
          } > functions/.env
          # Storage rules are deployed manually from the console (the default
          # bucket must be initialized first); CI deploys functions only.
          firebase deploy --only functions --project onepstudio-9a3ef --force

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: onepstudio-9a3ef
