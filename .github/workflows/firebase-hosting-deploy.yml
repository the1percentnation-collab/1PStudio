name: Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Write service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/gsa.json

      - name: Deploy hosting
        run: npx firebase-tools deploy --only hosting --project onepstudio-9a3ef
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gsa.json
